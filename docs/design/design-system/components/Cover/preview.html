<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>twise</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-page); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .art svg { display:block; width:480px; height:288px; }
  .mint { fill:var(--mint); }
  .soft { fill:var(--mint-soft); }
  .ink { fill:var(--ink); }
  .paper { fill:var(--sketch-paper); }
  .line { fill:none; stroke:var(--ink); stroke-width:3.2; stroke-linecap:round; }
  .blk { rx:var(--radius-xl); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:120px; line-height:.9; font-weight:750; letter-spacing:-.03em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      mint 176×264 bleeding off the top (the brand, largest) · ink and mint discs r=72 overlapping (the couple, like the owl's two eyes) · mint-soft 144×120 · mint disc r=40 — ≈35% of 960×288
  arrangement one tall mint slab with a coin pair beside it, like the "juntos" illustration: two coins, one mint, one ink, overlapping
  pattern     discs and pills from "cantos generosos, amigável" (radius-xl, radius-full) plus three hand-drawn spark strokes in sketch-ink, the illustration signature
  scales      gutters space-4 (16); slab corners radius-xl (28); pills 16 tall = rx 8 (radius-full → half the short side); pitch space-6 (24)
-->
<rect class="mint blk" x="16" y="-28" width="176" height="292" rx="28"/>
<rect class="soft blk" x="208" y="152" width="144" height="112" rx="28"/>
<circle class="ink" cx="340" cy="112" r="72"/>
<circle class="mint" cx="420" cy="112" r="72" fill-opacity=".92"/>
<rect class="ink" x="40" y="200" width="64" height="16" rx="8"/>
<rect class="soft" x="40" y="224" width="112" height="16" rx="8"/>
<rect class="mint" x="232" y="176" width="40" height="16" rx="8"/>
<rect class="mint" x="232" y="200" width="88" height="16" rx="8"/>
<rect class="mint" x="232" y="224" width="64" height="16" rx="8"/>
<path class="line" d="M262 36l-6-12M246 52l-12-5M276 30l2-13"/>
</svg>
</div>
<div class="words">
<h1 class="name">twise</h1>
<p class="tag">Leve, claro, a dois.</p>
</div>
</div>
</body>
</html>
