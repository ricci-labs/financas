<!-- @dsCard group="Formulários" height=600 -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>TextField</title>
<style>body{margin:0;padding:20px;background:var(--bg-page)}.lbl{margin:0 0 6px;font:600 12px/16px var(--font-sans);color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em}.phone{width:320px;height:640px;border-radius:36px;overflow:hidden;border:1px solid var(--border);background:var(--bg-page);flex:none}</style></head>
<body>
<div class="fn-stack" style="max-width:360px">
 <div class="fn-field">
  <label class="fn-field__label" for="e">E-mail <b aria-hidden="true">*</b></label>
  <div class="fn-input"><input id="e" type="email" placeholder="nome@exemplo.com" autocomplete="email" required></div>
 </div>
 <div class="fn-field">
  <label class="fn-field__label" for="p">Senha <b aria-hidden="true">*</b></label>
  <p class="fn-field__help" id="ph" style="margin:0">Use pelo menos 12 caracteres. Uma frase fácil de lembrar funciona bem.</p>
  <div class="fn-input fn-input--error"><input id="p" type="password" value="cafe1234" aria-invalid="true" aria-describedby="ph pe" required><button class="fn-input__toggle" type="button" aria-label="Mostrar senha" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Mostrar</button></div>
  <div class="fn-field__error" id="pe"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>Use pelo menos 12 caracteres.</div>
 </div>
 <div class="fn-field">
  <label class="fn-field__label" for="n">Nova senha <b aria-hidden="true">*</b></label>
  <div class="fn-input"><input id="n" type="text" value="café com pão de queijo" required><button class="fn-input__toggle" type="button" aria-label="Ocultar senha" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.2A10 10 0 0 1 12 4c6.4 0 10 8 10 8a17 17 0 0 1-2.2 3.2M6.6 6.6A17 17 0 0 0 2 12s3.6 8 10 8a10 10 0 0 0 5.4-1.6M2 2l20 20M14.1 14.1a3 3 0 0 1-4.2-4.2"/></svg>Ocultar</button></div>
 </div>
 <div class="fn-field">
  <label class="fn-field__label" for="r">E-mail <b aria-hidden="true">*</b></label>
  <div class="fn-input fn-input--readonly"><input id="r" type="email" value="member.b@exemplo.com" readonly></div>
 </div>
 <div class="fn-field">
  <label class="fn-field__label" for="d">Descrição</label>
  <div class="fn-input"><input id="d" value="Jantar de aniversário da Member B"></div>
  <div class="fn-field__counter">34/40</div>
 </div>
</div>
</body>
</html>
