<!-- @dsCard group="Padrões financeiros" height=300 -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>BudgetProgress</title>
<style>body{margin:0;padding:20px;background:var(--bg-page)}</style></head>
<body>
<div class="fn-card fn-stack" style="max-width:420px">
 <div class="fn-budget"><div class="fn-budget__head"><span>Transporte</span><span>R$ 180 de R$ 400</span></div>
  <div class="fn-progress" role="img" aria-label="45% usado, dentro do ritmo"><div class="fn-progress__fill" style="width:45%"></div><span class="fn-progress__pace" style="left:52%"></span></div>
  <div class="fn-budget__note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>No ritmo</div></div>
 <div class="fn-budget fn-budget--ahead"><div class="fn-budget__head"><span>Mercado</span><span>R$ 720 de R$ 1.000</span></div>
  <div class="fn-progress" role="img" aria-label="72% usado, adiantado"><div class="fn-progress__fill" style="width:72%"></div><span class="fn-progress__pace" style="left:52%"></span></div>
  <div class="fn-budget__note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>Adiantado: 20% acima do ritmo</div></div>
 <div class="fn-budget fn-budget--over"><div class="fn-budget__head"><span>Lazer</span><span>R$ 460 de R$ 400</span></div>
  <div class="fn-progress" role="img" aria-label="115% usado, estourado"><div class="fn-progress__fill" style="width:100%"></div><span class="fn-progress__pace" style="left:52%"></span></div>
  <div class="fn-budget__note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>Passou R$ 60,00</div></div>
</div>
</body>
</html>
