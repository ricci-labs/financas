<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animação · confirmando → link vencido · desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
.tw-moment{box-sizing:border-box;min-height:844px;background:#80dca5;color:#17191c;font-family:'Figtree',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:20px 16px 32px;text-align:center}
.tw-moment *{box-sizing:border-box}
.tw-logo{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:750;font-size:22px;letter-spacing:-0.03em;color:#17191c;text-decoration:none}
.tw-logo img{width:28px;height:28px}
.tw-moment-art{flex:1 1 0;display:flex;align-items:center;justify-content:center;width:100%;min-height:180px;padding:8px 0}
.tw-moment-art img{width:100%;height:100%;max-width:360px;object-fit:contain}
.tw-moment-body{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:400px}
.tw-moment h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:750;font-size:30px;line-height:36px;letter-spacing:-0.02em;text-wrap:balance}
.tw-moment-text{margin:0;font-size:16px;line-height:24px;color:#17191c}
.tw-busy{display:inline-flex;align-items:center;gap:8px}
.tw-steps{display:flex;align-items:flex-start;justify-content:center;width:100%;max-width:340px;margin:16px 0 0;padding:0;list-style:none}
.tw-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:13px;line-height:18px;font-weight:600;color:#17191c}
.tw-step + .tw-step::before{content:"";position:absolute;top:13px;right:calc(50% + 18px);width:calc(100% - 36px);height:2px;background:#17191c;border-radius:2px}
.tw-step.is-next + .tw-step::before,.tw-step.is-now + .tw-step::before{background:transparent;border-top:2px dashed #17191c;height:0}
.tw-dot{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.tw-step.is-done .tw-dot{background:#17191c;color:#80dca5}
.tw-step.is-now .tw-dot{background:#ffffff;color:#17191c;box-shadow:0 0 0 2px #17191c}
.tw-step.is-next .tw-dot{background:transparent;box-shadow:inset 0 0 0 2px #17191c;color:#17191c}
.tw-step.is-next{font-weight:500}
.tw-moment-actions{width:100%;max-width:400px;margin-top:24px;display:flex;flex-direction:column;gap:12px}
.tw-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border:0;border-radius:999px;font:650 16px/24px 'Figtree',sans-serif;cursor:pointer}
.tw-btn.primary{background:#17191c;color:#ffffff}
.tw-next{margin:0;padding:12px 16px;border-radius:14px;outline:2px dashed #17191c;outline-offset:-2px;font-size:14px;line-height:20px;text-align:left;display:flex;gap:10px;align-items:flex-start;background:#e3f7eb}
.tw-next svg{flex:none;margin-top:1px}
.tw-quiet{margin:0;font-size:14px;line-height:20px;color:#17191c}
.tw-moment.is-calm{background:#efebe0}
.tw-moment-text strong{font-weight:700}
.tw-btn.secondary{background:#ffffff;color:#17191c;box-shadow:inset 0 0 0 1.5px #17191c}
.tw-btn.wait{background:#e3f7eb;color:#5b5f66;cursor:not-allowed}
.tw-link{color:#17191c;font-weight:700;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.tw-foot{margin:0;font-size:15px;line-height:22px;color:#17191c}
.tw-tip{display:flex;gap:8px;justify-content:center;align-items:center;margin:0;font-size:14px;line-height:20px;color:#17191c}
.tw-divider{display:flex;align-items:center;gap:12px;margin:4px 0 0;font-size:14px;line-height:20px;font-weight:600;color:#5b5f66}
.tw-divider::before,.tw-divider::after{content:"";flex:1;height:1px;background:#d6d1c4}
.tw-field{display:flex;flex-direction:column;gap:8px;text-align:left}
.tw-label{font-size:14px;line-height:20px;font-weight:600}
.tw-label b{color:#b42318;margin-left:2px}
.tw-input{display:flex;align-items:center;min-height:48px;padding:0 16px;background:#ffffff;border:1px solid #8a877f;border-radius:14px}
.tw-control{flex:1;min-width:0;height:46px;border:0;outline:0;background:transparent;color:#17191c;font:400 16px/24px 'Figtree',sans-serif;padding:0}
.tw-spin{animation:tw-rotate 0.8s linear infinite}
@keyframes tw-rotate{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.tw-spin{animation:none}}
@media (min-width: 1024px){
  .tw-moment{min-height:900px;padding:32px 48px 48px}
  .tw-moment-art img{max-width:440px}
  .tw-moment h1{font-size:36px;line-height:42px}
}
.k g{transform-box:fill-box;transform-origin:center}
#k-chain{transform-origin:top center}
#k-spark1,#k-spark2{transform-origin:left bottom}
.tw-swap{display:grid;width:100%}
.tw-swap > *{grid-area:1/1}
.tw-moment-art svg{width:100%;max-width:360px;height:100%}
#k-olhos-abertos{opacity:0}#k-piscadinha{opacity:0}
#k-hourglass{animation:c-amp 6.5s linear infinite}
@keyframes c-amp{0.00%{opacity:1;transform:rotate(0)}9.23%{opacity:1;transform:rotate(0)}18.46%{opacity:1;transform:rotate(180deg)}36.92%{opacity:1;transform:rotate(180deg)}41.54%{opacity:0;transform:rotate(180deg) scale(0)}95.38%{opacity:0;transform:rotate(180deg) scale(0)}100.00%{opacity:1;transform:rotate(0)}}
#k-zz{animation:c-zz 6.5s linear infinite}
@keyframes c-zz{0.00%{opacity:.2;transform:translateY(4px)}30.77%{opacity:1;transform:translateY(-6px)}38.46%{opacity:0;transform:translateY(-12px)}95.38%{opacity:0;transform:translateY(-12px)}100.00%{opacity:.2;transform:translateY(4px)}}
#k-chain{animation:c-chain 6.5s linear infinite}
@keyframes c-chain{0.00%{opacity:0;transform:scale(0)}43.08%{opacity:0;transform:scale(0)}46.15%{opacity:1;transform:scale(1.12)}48.46%{opacity:1;transform:none}51.54%{opacity:1;transform:rotate(-9deg)}54.62%{opacity:1;transform:rotate(6deg)}57.69%{opacity:1;transform:rotate(-2deg)}60.00%{opacity:1;transform:none}89.23%{opacity:1;transform:none}93.85%{opacity:0;transform:scale(0)}100.00%{opacity:0;transform:scale(0)}}
.tw-moment{animation:c-bg 6.5s linear infinite}
@keyframes c-bg{0.00%{background-color:#80dca5}36.92%{background-color:#80dca5}43.08%{background-color:#efebe0}93.85%{background-color:#efebe0}100.00%{background-color:#80dca5}}
.tw-st-a{animation:c-a 6.5s linear infinite}
@keyframes c-a{0.00%{opacity:1;transform:none}36.92%{opacity:1;transform:none}40.77%{opacity:0;transform:translateY(-6px)}95.38%{opacity:0;transform:translateY(-6px)}100.00%{opacity:1;transform:none}}
.tw-st-b{animation:c-b 6.5s linear infinite}
@keyframes c-b{0.00%{opacity:0;transform:translateY(8px)}41.54%{opacity:0;transform:translateY(8px)}45.38%{opacity:1;transform:none}90.77%{opacity:1;transform:none}94.62%{opacity:0;transform:translateY(8px)}100.00%{opacity:0;transform:translateY(8px)}}
.tw-st-c{animation:c-c 6.5s linear infinite}
@keyframes c-c{0.00%{opacity:0;transform:translateY(16px)}49.23%{opacity:0;transform:translateY(16px)}53.08%{opacity:1;transform:none}90.77%{opacity:1;transform:none}94.62%{opacity:0;transform:translateY(16px)}100.00%{opacity:0;transform:translateY(16px)}}
.tw-st-b .tw-divider{color:#5b5f66}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.tw-moment{background:#efebe0}#k-hourglass,#k-zz,.tw-st-a{opacity:0}}
@media (min-width:1024px){
.tw-moment{justify-content:center}
.tw-moment-art{flex:0 0 auto;height:400px;min-height:0}
.tw-moment-art svg,.tw-moment-art img{max-width:480px}
.tw-moment-body{max-width:560px}
.tw-moment-actions{max-width:400px;margin-top:32px}
}
</style>
