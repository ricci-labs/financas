name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: 🚀 Publish image
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: APP_VERSION=${{ env.SHA }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:main
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tell how to deploy it on the LAN
        run: |
          {
            echo "### Image published"
            echo ""
            echo "\`${IMAGE}:${SHA}\` (also \`:main\`)."
            echo ""
            echo "Access is LAN-only, so GitHub can't trigger Dokploy. Redeploy \`financas-api\`"
            echo "from Dokploy on the home network, or pin this SHA to roll forward or back."
          } >> "$GITHUB_STEP_SUMMARY"
