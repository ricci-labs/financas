name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 🧹 Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Lint and format (Biome)
        run: pnpm lint

      - name: No comments in source code
        run: pnpm lint:comments

      - name: Types and schemas in their own files
        run: pnpm lint:file-roles

      - name: Web visual values only from tokens
        run: pnpm lint:tokens

      - name: Web copy only in messages files
        run: pnpm lint:copy

      - name: Token contrast meets WCAG AA
        run: pnpm check:contrast

      - name: Email colours match the design tokens
        run: pnpm check:email-colors

      - name: Type check
        run: pnpm typecheck

      - name: Architecture rules
        run: pnpm depcruise

      - name: Docs frontmatter and links
        run: pnpm docs:check

  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Install Chromium for the web tests
        run: pnpm --filter @financas/web exec playwright install --with-deps --only-shell chromium

      - name: Run tests
        run: pnpm test

  integration:
    name: 🐘 Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Start Postgres
        run: pnpm db:up

      - name: Configure environment
        run: cp .env.example .env

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Migrations match the schema
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain apps/api/drizzle)" || {
            echo "::error::Table definitions changed without a migration. Run pnpm db:generate and commit it."
            git status --porcelain apps/api/drizzle
            exit 1
          }

      - name: Run integration tests
        run: pnpm test:integration

  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Build web and API
        run: pnpm build

      - name: Check the initial bundle size
        run: pnpm check:bundle

  image:
    name: 🐳 Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: APP_VERSION=${{ github.sha }}
          tags: financas:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start an empty Postgres
        run: docker compose -f compose.dev.yml up -d --wait

      - name: Image migrates the database and becomes ready
        run: |
          docker run -d --name financas-ci --network host \
            -e PORT=3100 \
            -e DATABASE_URL=postgres://financas_app:app_dev_password@127.0.0.1:5433/financas \
            -e DATABASE_MIGRATION_URL=postgres://financas_owner:owner_dev_password@127.0.0.1:5433/financas \
            -e PUBLIC_URL=http://localhost:3100 \
            -e SMTP_HOST=smtp.example.test \
            -e EMAIL_FROM=financas@example.test \
            financas:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health/ready; then break; fi
            if [ "$attempt" = 30 ]; then docker logs financas-ci; exit 1; fi
            sleep 2
          done

      - name: Image serves the web app with its headers
        run: |
          set -x
          page=$(curl -fsS -D headers.txt http://127.0.0.1:3100/login)
          echo "$page" | grep -q '<div id="root"></div>'
          grep -qi "^content-security-policy: .*default-src 'self'" headers.txt
          grep -qi '^cache-control: no-cache' headers.txt
          asset=$(echo "$page" | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsS -D asset-headers.txt -o /dev/null "http://127.0.0.1:3100$asset"
          grep -qi '^cache-control: public, max-age=31536000, immutable' asset-headers.txt
          curl -fsS -o /dev/null http://127.0.0.1:3100/email/owl-key.png
          curl -fsS -H 'Accept-Encoding: gzip' -D gzip-headers.txt -o /dev/null "http://127.0.0.1:3100$asset"
          grep -qi '^content-encoding: gzip' gzip-headers.txt
          curl -fsS -D sw-headers.txt -o /dev/null http://127.0.0.1:3100/sw.js
          grep -qi '^cache-control: no-cache' sw-headers.txt
          curl -fsS http://127.0.0.1:3100/manifest.webmanifest | grep -q '"name":"Twise"'
          echo "$page" | grep -q 'rel="manifest"'
          curl -s http://127.0.0.1:3100/api/nope | grep -q '"error"'

      - name: Every migration was applied
        run: |
          applied=$(docker compose -f compose.dev.yml exec -T db \
            psql -U postgres -d financas -tAc 'select count(*) from drizzle.__drizzle_migrations')
          expected=$(ls apps/api/drizzle/*.sql | wc -l)
          echo "Applied $applied of $expected migrations"
          test "$applied" -eq "$expected"

  pr-title:
    name: 📝 PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm commitlint

  secrets:
    name: 🔐 Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks

      - name: Scan full history for secrets
        run: ./gitleaks git --redact --no-banner .
