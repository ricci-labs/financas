name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 🧹 Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Lint and format (Biome)
        run: pnpm lint

      - name: No comments in source code
        run: pnpm lint:comments

      - name: Types and schemas in their own files
        run: pnpm lint:file-roles

      - name: Type check
        run: pnpm typecheck

      - name: Architecture rules
        run: pnpm depcruise

      - name: Docs frontmatter and links
        run: pnpm docs:check

  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Run tests
        run: pnpm test

  integration:
    name: 🐘 Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Start Postgres
        run: pnpm db:up

      - name: Configure environment
        run: cp .env.example .env

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Migrations match the schema
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain apps/api/drizzle)" || {
            echo "::error::Table definitions changed without a migration. Run pnpm db:generate and commit it."
            git status --porcelain apps/api/drizzle
            exit 1
          }

      - name: Run integration tests
        run: pnpm test:integration

  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Build web and API
        run: pnpm build

  pr-title:
    name: 📝 PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm commitlint

  secrets:
    name: 🔐 Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks

      - name: Scan full history for secrets
        run: ./gitleaks git --redact --no-banner .
