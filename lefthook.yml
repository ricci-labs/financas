output:
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{js,mjs,cjs,ts,tsx,json,jsonc,css}'
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: no-comments
      glob: '*.{js,mjs,cjs,ts,tsx}'
      run: node scripts/check-no-comments.mjs {staged_files}
    - name: file-roles
      glob: '*.{ts,tsx}'
      run: node scripts/check-file-roles.mjs {staged_files}
    - name: web-tokens
      glob: 'apps/web/src/**/*.{ts,tsx}'
      run: node scripts/check-tokens.mjs {staged_files}
    - name: web-copy
      glob: 'apps/web/src/**/*.tsx'
      run: node scripts/check-copy.mjs {staged_files}
    - name: web-contrast
      glob: 'apps/web/src/styles/tokens/*.css'
      run: node scripts/check-contrast.mjs
    - name: gitleaks
      run: command -v gitleaks >/dev/null && gitleaks git --pre-commit --staged --redact --no-banner . || echo "gitleaks not installed locally, CI still checks"

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
